<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Project — Highlight Group</title>
    <meta name="description" content="Selected work from Highlight Group.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../assets/general.css">

<body>
    <div id="siteNavRoot"></div>

    <main class="theme-dark">
        <section class="container project-hero">
            <a class="eyebrow project-back" href="../">&larr; All Work</a>
            <h1 class="h1" id="projectBrand"></h1>
            <span class="eyebrow" id="projectEyebrow"></span>

            <div class="project-media" id="projectMedia"></div>

            </div>
        </section>

        <section class="container portfolio-grid project-gallery">
            <div class="portfolio-item portfolio-visual span-row-2 span-col-2">
                <div class="portfolio-media"><img src="../../assets/news/0faa8690ce6bbe78920da3eb83d79693.jpg"
                        alt="" loading="lazy" decoding="async"></div>
            </div>
            <div class="portfolio-item portfolio-visual">
                <div class="portfolio-media"><img src="../../assets/news/12fa2782f924b73e672f46151e6a081e.jpg"

            </div>
            <div class="portfolio-item portfolio-visual">
                <div class="portfolio-media"><img src="../../assets/news/e2d5894c315e9de74bc4d77d8629ad92.jpg"
                        alt="" loading="lazy" decoding="async"></div>
            </div>
            <div class="portfolio-item portfolio-visual">
                <div class="portfolio-media"><img src="../../assets/news/05aa12c62f5c629d394711ecf7d73beb.jpg"
                        alt="" loading="lazy" decoding="async"></div>
            </div>
            <div class="portfolio-item portfolio-visual">
                <div class="portfolio-media"><img src="../../assets/news/4c751c3c20ad526f02a999c9f6edc413.jpg"
                        alt="" loading="lazy" decoding="async"></div>
            </div>
            <div class="portfolio-item portfolio-visual span-col-2">
                <div class="portfolio-media"><img src="../../assets/news/86abf3e7ebf49c10b5f4dc9ec3253afd.jpg"
                        alt="" loading="lazy" decoding="async"></div>
            </div>
        </section>

        <section class="container portfolio-cta">
            <h2 class="h2">Got something worth highlighting?</h2>
            <a class="btn-text btn-text--link" href="../../#contact">Get in touch</a>
        </section>
    </main>

    <div id="siteFooterRoot"></div>

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="../../assets/nav-footer.js"></script>
    <script src="../../assets/general.js"></script>

</html>
